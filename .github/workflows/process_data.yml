name: Process Report Absensi

on:
  push:
    paths:
      - '**.xlsx'
      - '**.xls'
  workflow_dispatch: # Memungkinkan eksekusi manual

jobs:
  process-excel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
          
      - name: Run Processing Script
        run: |
          python process_report.py
          
      - name: Upload Processed File
        uses: actions/upload-artifact@v3
        with:
          name: Laporan-Absensi-Hasil
          path: 'Report Data BA plantation2 - Processed_Final*.xlsx'
          retention-days: 7
